name: Live update from SAFF

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay scheduled runs at busy times)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read SAFF and update data.js
        run: node scripts/update.mjs
      - name: Keep the raw SAFF pages for checking
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saff-raw
          path: raw/
          retention-days: 3
          if-no-files-found: ignore
      - name: Commit when the data changed
        id: commit
        run: |
          if git diff --quiet -- site/data.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "alula-live-update"
            git config user.email "actions@users.noreply.github.com"
            git add site/data.js last-run.json
            git commit -m "Live update from SAFF $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
