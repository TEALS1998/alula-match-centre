name: Live update from SAFF

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # every 10 minutes, off the busy :00 mark (GitHub may still delay scheduled runs)
  workflow_dispatch:
    inputs:
      diag:
        description: "Keep the raw SAFF pages for checking"
        required: false
        default: "no"
      test_notify:
        description: "Send a test notification to the phone (yes/no)"
        required: false
        default: "no"
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # a code push gets its own lane, so the two minute data runs can never cancel its deploy
  group: ${{ github.event_name == 'push' && 'code-push' || 'live-update' }}
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read SAFF and update data.js
        run: node scripts/update.mjs
        env:
          SAFF_DIAG: ${{ (github.event_name == 'push' || github.event.inputs.diag == 'yes') && '1' || '' }}
      - name: Keep the raw SAFF pages for checking
        if: always() && (github.event_name == 'push' || github.event.inputs.diag == 'yes')
        uses: actions/upload-artifact@v4
        with:
          name: saff-raw
          path: raw/
          retention-days: 3
          if-no-files-found: ignore
      - name: Commit when the data changed
        id: commit
        run: |
          if git diff --quiet -- site/data.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git show HEAD:site/data.js > "$RUNNER_TEMP/before.js" || true
            git config user.name "alula-live-update"
            git config user.email "actions@users.noreply.github.com"
            git add site/data.js last-run.json
            git commit -m "Live update from SAFF $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Phone notification when a fixture changes
        if: steps.commit.outputs.changed == 'true'
        run: node scripts/notify.mjs "$RUNNER_TEMP/before.js" site/data.js
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'alula-mc-zkyj9vb8oi' }}
      - name: Test notification
        if: github.event.inputs.test_notify == 'yes'
        run: node scripts/notify.mjs --test
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'alula-mc-zkyj9vb8oi' }}

  deploy:
    needs: update
    if: always() && (github.event_name == 'push' || needs.update.outputs.changed == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
